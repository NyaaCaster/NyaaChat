# Image proxy cache. Defined at http context (this file is included into
# the base image's /etc/nginx/nginx.conf http {} block via conf.d/*.conf).
# 5GB max disk, 30 day inactive eviction. levels=1:2 keeps the directory
# tree shallow. Cache survives nginx reload, but lives in the container —
# docker-compose mounts a named volume so it survives image rebuilds.
proxy_cache_path /var/cache/nginx/images
                 levels=1:2
                 keys_zone=image_cache:16m
                 max_size=5g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 3095;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. CSP must allow https connect-src so users can hit any
    # LLM provider endpoint they configure.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression. gzip_static serves the .gz that vite/rollup produces; gzip
    # is the runtime fallback for anything not pre-compressed.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Hashed asset bundles are immutable — cache them aggressively.
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and the SPA fallback must never be cached, otherwise users
    # get stuck on stale builds after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Web search reverse proxy. Browser cannot hit the SearXNG instance
    # directly (no CORS headers + cross-origin), so the frontend posts to
    # /api/search here and we forward to the SearXNG host. JSON output is
    # enabled in SearXNG settings.yml `search.formats`. Timeout is generous
    # (search engines themselves take 2-3s) but bounded to keep the chat
    # path responsive.
    #
    # Exact match on /api/search proxies to upstream /search; a trailing
    # slash variant is rejected on purpose to avoid path-rewrite ambiguity
    # with proxy_pass.
    location = /api/search {
        proxy_pass http://j.hony-wen.com:1441/search;
        proxy_http_version 1.1;
        proxy_set_header Host j.hony-wen.com:1441;
        proxy_set_header User-Agent "NyaaChat";
        proxy_set_header Accept "application/json";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # Image cache proxy. Generated images come from upstream blob/CDN URLs
    # (oaidalleapi blob, xai-images S3, googleapis, chatgpt-topup, etc.) —
    # many of these are unreachable from mainland China and the URLs are
    # short-lived signed tokens. We proxy through nginx so the browser sees
    # a same-origin URL, and proxy_cache stores the bytes so the image
    # survives the upstream URL expiring (5GB / 30 days LRU).
    #
    # Path-encoded form: /api/image-proxy/<scheme>/<host>/<path>?<query>
    # Why not query-string? nginx's $arg_url stays URL-encoded (no native
    # decode primitive in the open-source build), so a regex against an
    # encoded value is fragile and proxy_pass with an encoded URL fails.
    # Splitting the upstream into path segments lets nginx see scheme/host
    # as plain strings and forward query verbatim.
    #
    # Host whitelist guards against open-relay abuse.
    location ~ "^/api/image-proxy/(https?)/([A-Za-z0-9.\-]+)(/.*)?$" {
        set $img_scheme $1;
        set $img_host $2;
        set $img_path $3;

        if ($img_host !~* "^(oaidalleapiprodscus\.blob\.core\.windows\.net|.+\.blob\.core\.windows\.net|xai-images\.s3\.amazonaws\.com|.+\.s3\.amazonaws\.com|.+\.s3\.us-[a-z0-9-]+\.amazonaws\.com|openai\.chatnewai\.com|.+\.chatnewai\.com|files\.chatgpt-topup\.com|.+\.chatgpt-topup\.com|love\.qinyan\.icu|.+\.qinyan\.icu|grok\.codexai\.team|.+\.codexai\.team|.+\.googleapis\.com|.+\.googleusercontent\.com|.+\.cdn\.openai\.com)$") {
            return 403 "image host not allowed";
        }

        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;
        resolver_timeout 5s;
        proxy_pass $img_scheme://$img_host$img_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $img_host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;
        proxy_cache image_cache;
        proxy_cache_key "$img_scheme://$img_host$img_path$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # MCP reverse proxy. Forwards browser-side requests to the NyaaChat-MCP
    # streamable-HTTP service (h.hony-wen.com:3094) and injects the shared
    # Bearer token server-side so the API key never reaches the frontend.
    # MCP_HOST / MCP_PORT / MCP_API_KEY come from .env via envsubst at
    # container start (see docker-compose env_file + NGINX_ENVSUBST_FILTER).
    #
    # Streamable-HTTP responses can be SSE-style (text/event-stream) or
    # plain JSON depending on the call, so proxy_buffering is off and HTTP
    # keepalive uses 1.1.
    location = /api/mcp {
        proxy_pass ${MCP_HOST}:${MCP_PORT}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${MCP_API_KEY}";
        proxy_set_header User-Agent "NyaaChat";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # MCP health probe. Public on the upstream (no auth required) — used
    # by the settings panel "test connectivity" button.
    location = /api/mcp/health {
        proxy_pass ${MCP_HOST}:${MCP_PORT}/health;
        proxy_http_version 1.1;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
