# Image proxy cache. Defined at http context (this file is included into
# the base image's /etc/nginx/nginx.conf http {} block via conf.d/*.conf).
# 5GB max disk, 30 day inactive eviction. levels=1:2 keeps the directory
# tree shallow. Cache survives nginx reload, but lives in the container —
# docker-compose mounts a named volume so it survives image rebuilds.
proxy_cache_path /var/cache/nginx/images
                 levels=1:2
                 keys_zone=image_cache:16m
                 max_size=5g
                 inactive=30d
                 use_temp_path=off;

# WebSocket upgrade map (http context). Used by the ComfyUI reverse proxies so
# the /ws progress channel can tunnel through nginx. Maps the request's
# Upgrade header to the right Connection header value (upgrade vs close).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Fixed-ComfyUI auth token holder. The token is auto-generated by the ComfyUI
# server and contains literal `$` (e.g. a bcrypt-shaped "$2b$12$..."), which
# nginx would otherwise mis-parse as variable references ($1/$2/...) if placed
# directly in a proxy_set_header string. `geo` default values are NOT subject to
# variable interpolation (same idiom as `geo $dollar { default "$"; }`), so the
# token is stored verbatim here and referenced as a single variable below — its
# runtime value is never re-parsed, so `$` survives intact. The literal value is
# injected by envsubst from COMFYUI_FIXED_TOKEN (.env) at container start.
geo $comfy_fixed_token {
    default "${COMFYUI_FIXED_TOKEN}";
}

server {
    listen 3095;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. CSP must allow https connect-src so users can hit any
    # LLM provider endpoint they configure.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression. gzip_static serves the .gz that vite/rollup produces; gzip
    # is the runtime fallback for anything not pre-compressed.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Hashed asset bundles are immutable — cache them aggressively.
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and the SPA fallback must never be cached, otherwise users
    # get stuck on stale builds after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Web search reverse proxy — DISABLED. The built-in web search feature
    # has been superseded by the NyaaChat-MCP `web_search` tool (served via
    # /api/mcp below). To re-enable the built-in search: uncomment this
    # block AND flip WEB_SEARCH_FEATURE_ENABLED in src/lib/searchApi.ts.
    #
    # Browser cannot hit the SearXNG instance directly (no CORS headers +
    # cross-origin), so the frontend posts to /api/search here and we
    # forward to the SearXNG host. JSON output is enabled in SearXNG
    # settings.yml `search.formats`.
    #
    # location = /api/search {
    #     proxy_pass http://j.hony-wen.com:1441/search;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host j.hony-wen.com:1441;
    #     proxy_set_header User-Agent "NyaaChat";
    #     proxy_set_header Accept "application/json";
    #     proxy_redirect off;
    #     proxy_connect_timeout 5s;
    #     proxy_send_timeout    15s;
    #     proxy_read_timeout    15s;
    # }

    # Image cache proxy. Generated images come from upstream blob/CDN URLs
    # (oaidalleapi blob, xai-images S3, googleapis, chatgpt-topup, etc.) —
    # many of these are unreachable from mainland China and the URLs are
    # short-lived signed tokens. We proxy through nginx so the browser sees
    # a same-origin URL, and proxy_cache stores the bytes so the image
    # survives the upstream URL expiring (5GB / 30 days LRU).
    #
    # Path-encoded form: /api/image-proxy/<scheme>/<host>/<path>?<query>
    # Why not query-string? nginx's $arg_url stays URL-encoded (no native
    # decode primitive in the open-source build), so a regex against an
    # encoded value is fragile and proxy_pass with an encoded URL fails.
    # Splitting the upstream into path segments lets nginx see scheme/host
    # as plain strings and forward query verbatim.
    #
    # Host whitelist guards against open-relay abuse.
    location ~ "^/api/image-proxy/(https?)/([A-Za-z0-9.\-]+)(/.*)?$" {
        set $img_scheme $1;
        set $img_host $2;
        set $img_path $3;

        if ($img_host !~* "^(oaidalleapiprodscus\.blob\.core\.windows\.net|.+\.blob\.core\.windows\.net|xai-images\.s3\.amazonaws\.com|.+\.s3\.amazonaws\.com|.+\.s3\.us-[a-z0-9-]+\.amazonaws\.com|openai\.chatnewai\.com|.+\.chatnewai\.com|files\.chatgpt-topup\.com|.+\.chatgpt-topup\.com|love\.qinyan\.icu|.+\.qinyan\.icu|grok\.codexai\.team|.+\.codexai\.team|.+\.googleapis\.com|.+\.googleusercontent\.com|.+\.cdn\.openai\.com)$") {
            return 403 "image host not allowed";
        }

        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;
        resolver_timeout 5s;
        proxy_pass $img_scheme://$img_host$img_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $img_host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;
        proxy_cache image_cache;
        proxy_cache_key "$img_scheme://$img_host$img_path$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # MCP reverse proxy. Forwards browser-side requests to the NyaaChat-MCP
    # streamable-HTTP service (h.hony-wen.com:3094) and injects the shared
    # Bearer token server-side so the API key never reaches the frontend.
    # MCP_HOST / MCP_PORT / MCP_API_KEY come from .env via envsubst at
    # container start (see docker-compose env_file + NGINX_ENVSUBST_FILTER).
    #
    # Streamable-HTTP responses can be SSE-style (text/event-stream) or
    # plain JSON depending on the call, so proxy_buffering is off and HTTP
    # keepalive uses 1.1.
    location = /api/mcp {
        proxy_pass ${MCP_HOST}:${MCP_PORT}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${MCP_API_KEY}";
        proxy_set_header User-Agent "NyaaChat";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # MCP health probe. Public on the upstream (no auth required) — used
    # by the settings panel "test connectivity" button.
    location = /api/mcp/health {
        proxy_pass ${MCP_HOST}:${MCP_PORT}/health;
        proxy_http_version 1.1;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # Extension runtime host. This is intentionally separate from MCP: browser
    # extensions need ordinary HTTP endpoints, while MCP remains the LLM tool
    # protocol proxy below.
    location /api/ext-host/ {
        proxy_pass http://ext-host:3099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # SillyTavern-compatible custom voice endpoint. The sidecar enforces
    # endpoint presets/whitelists so this route does not become an arbitrary
    # URL relay for any extension.
    location = /api/openai/custom/generate-voice {
        proxy_pass http://ext-host:3099/openai/custom/generate-voice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # SillyTavern extension compat — ESM-import shim serving depth.
    #
    # Real ST extensions hardcode relative imports against ST's directory depth,
    # e.g. an entry at /scripts/extensions/third-party/<id>/index.js does
    #   import { saveSettingsDebounced } from "../../../../script.js"  → /script.js
    #   import { getContext }           from "../../../extensions.js"  → /scripts/extensions.js
    # Those relative specifiers resolve against the *script's own URL*, so the
    # only robust fix is to serve extensions at exactly ST's depth. The loader
    # injects each extension's entry from /scripts/extensions/third-party/<id>/;
    # this alias maps that back to the real files under /extensions/<id>/. The
    # compat shim modules (/script.js, /scripts/*.js) are then the resolution
    # targets for those imports (served by `location /` from the web root).
    location /scripts/extensions/third-party/ {
        alias /usr/share/nginx/html/extensions/;
    }

    # Shared-character backend reverse proxy. The shared library, accounts,
    # catfood and cover images are served by the SEPARATELY-deployed
    # nyaachat-shared service (own compose project, port 5107) joined via the
    # external `nyaachat-net` network. Proxying here keeps everything
    # same-origin for the browser, so cover-image URLs need no cross-port /
    # cross-origin juggling regardless of how the site is published.
    #
    # DNS is deferred to request time via Docker's embedded resolver
    # (127.0.0.11) + a variable upstream, so this front-end container still
    # boots when the shared backend is down or not yet deployed (requests just
    # 502 instead of nginx failing to start). The rewrite strips the
    # /api/shared/ prefix; the backend serves routes at its root.
    location /api/shared/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $shared_upstream nyaachat-shared;
        rewrite ^/api/shared/(.*)$ /$1 break;
        proxy_pass http://$shared_upstream:5107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        # Card json + cover image uploads from the share flow; also
        # chat-sessions uploads (up to 64 MB of JSON).
        client_max_body_size 120m;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # expand-kb — lives on shared-server (the writable owner of the shared DB).
    # Catfood + kb_max write must happen on the DB's writable connection; the
    # knowledge service only mounts the shared DB read-only (:ro).
    # Nginx exact-match (=) takes priority over the general /api/knowledge/
    # prefix location, regardless of config file order.
    location = /api/knowledge/expand-kb {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $shared_upstream nyaachat-shared;
        rewrite ^/api/knowledge/expand-kb$ /account/expand-kb break;
        proxy_pass http://$shared_upstream:5107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # /api/knowledge/ — knowledge base backend (nyaachat-knowledge:5108).
    # Same deferred-DNS + variable upstream pattern as /api/shared/ so the
    # frontend container still boots when the knowledge backend is down or
    # not yet deployed (requests just 502 instead of nginx failing to start).
    # The rewrite strips the /api/knowledge/ prefix; the backend serves
    # routes at its root.
    location /api/knowledge/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $kb_upstream nyaachat-knowledge;
        rewrite ^/api/knowledge/(.*)$ /$1 break;
        proxy_pass http://$kb_upstream:5108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        # Document uploads for knowledge base ingestion.
        client_max_body_size 120m;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ===================================================================
    # ComfyUI reverse proxies. Browsers on the (https) NyaaChat page cannot
    # reach a plain-http / remote ComfyUI server directly (CSP connect-src +
    # mixed-content blocking), so all ComfyUI traffic — /prompt, /history,
    # /view image bytes, and the /ws progress channel — is funneled through
    # nginx same-origin. This also sidesteps CORS entirely.
    # ===================================================================

    # Fixed ComfyUI server (NyaaComfyUI). The real URL lives only in .env and is
    # injected here by envsubst at container start (NGINX_ENVSUBST_FILTER allows
    # COMFYUI_), so it never reaches the frontend bundle. The frontend always
    # talks to same-origin /api/comfyui/fixed/*.
    location /api/comfyui/fixed/ {
        rewrite ^/api/comfyui/fixed/(.*)$ /$1 break;
        proxy_pass ${COMFYUI_FIXED_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "NyaaChat";
        # Server-side auth injection (same pattern as the MCP proxy). The token
        # comes from .env (COMFYUI_FIXED_TOKEN) via envsubst, so it never
        # reaches the frontend bundle or a browser-visible URL. Applied to every
        # sub-path incl. the /ws handshake, so HTTP + WebSocket share one auth.
        # Sourced from the `geo`-held variable so a `$`-containing token (the
        # ComfyUI server's auto-generated bcrypt-shaped token) is sent verbatim
        # instead of being mangled by nginx variable interpolation.
        proxy_set_header Authorization "Bearer $comfy_fixed_token";
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 16m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Custom ComfyUI servers (user-entered URL). Path-encoded form like the
    # image proxy so an arbitrary host:port can be carried without a per-user
    # nginx var:  /api/comfyui/custom/<scheme>/<host[:port]>/<path>?<query>
    # No host whitelist — the user supplies their own server and bears the
    # responsibility; requests are still same-origin/front-end-initiated only.
    location ~ "^/api/comfyui/custom/(https?)/([A-Za-z0-9.\-]+(?::[0-9]+)?)(/.*)?$" {
        set $cu_scheme $1;
        set $cu_host $2;
        set $cu_path $3;
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 ipv6=off valid=30s;
        resolver_timeout 5s;
        proxy_pass $cu_scheme://$cu_host$cu_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $cu_host;
        proxy_set_header User-Agent "NyaaChat";
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 16m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}