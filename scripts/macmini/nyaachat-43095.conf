# ============================================================================
# macmini HTTPS entry for NyaaChat (43095 → 127.0.0.1:3095, the app container).
#
# WHY THIS BLOCK EXISTS
#   Chrome only offers the PWA install prompt ("添加到主屏幕") on a *secure
#   context*. NyaaChat's app container publishes plain HTTP on :3095, and an
#   HTTP origin can serve a manifest but can never trigger the install UI:
#     https://developer.chrome.com/docs/lighthouse/pwa/installable-manifest
#   So the PWA feature is only actually usable through a TLS-terminating entry,
#   which is what this block provides. The app itself is unchanged and still
#   speaks HTTP on :3095 behind it.
#
#   Port choice: 43095 is the HTTPS twin of 3095 (same `43` + service-port
#   convention as 43080/43081). Verified free on macmini before creation.
#
# CERT: shared Let's Encrypt SAN cert (h.hony-wen.com + h.nyaa.host) that the
#   other 43xxx blocks already use; acme.sh renews it and reloads nginx.
#   Same certificate → no new cert plumbing, and no new 443 listener.
#
# AUTH: none. NyaaChat has its own in-app account system; the app is intended
#   to be reachable without an extra HTTP Basic gate (this mirrors the plain
#   :3095 entry, which is also unauthenticated). Adding Basic Auth here would
#   ALSO break the Android install flow, because the launched standalone window
#   cannot replay Basic credentials cleanly on every navigation.
#
# ROUTER: h.nyaa.host resolves to the home public IP, so the router must
#   forward TCP 43095 → 192.168.31.141 for external use. LAN access works
#   without any router change.
#
# Re-deploy / verify:
#   scp scripts/macmini/nyaachat-43095.conf macmini:/etc/nginx/conf.d/nyaachat-43095.conf
#   ssh macmini 'nginx -t && nginx -s reload'
#   ssh macmini 'curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1:43095/'              # 200
#   ssh macmini 'curl -sk -o /dev/null -w "%{content_type}\n" https://127.0.0.1:43095/site.webmanifest'  # application/manifest+json
#
# Rollback:
#   ssh macmini 'rm /etc/nginx/conf.d/nyaachat-43095.conf && nginx -t && nginx -s reload'
# ============================================================================

server {
    listen 43095 ssl;
    listen [::]:43095 ssl;
    server_name h.hony-wen.com h.nyaa.host;

    ssl_certificate     /etc/letsencrypt/h.hony-wen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/h.hony-wen.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Chat-session uploads / cover images / knowledge documents — same ceiling
    # as the app's own nginx.conf (client_max_body_size 120m) so the proxy is
    # never the narrower gate.
    client_max_body_size 120m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The app builds absolute URLs and its CSP allows https connect-src, so it
    # must be told the browser really came in over TLS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Streaming (chat completions stream token-by-token) must not be buffered
    # or the client sees the whole answer arrive at once.
    proxy_buffering off;
    proxy_redirect  off;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://127.0.0.1:3095;
    }
}
