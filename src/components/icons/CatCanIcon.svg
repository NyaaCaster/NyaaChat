<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="猫罐头"
>
  <defs>
    <!-- 银色金属渐变 -->
    <linearGradient id="metal-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8" />
      <stop offset="0.2" stop-color="#E2E8F0" />
      <stop offset="0.4" stop-color="#F8FAFC" />
      <stop offset="0.7" stop-color="#CBD5E1" />
      <stop offset="1" stop-color="#475569" />
    </linearGradient>

    <!-- 罐内凹陷阴影 -->
    <linearGradient id="metal-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569" />
      <stop offset="0.5" stop-color="#64748B" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>

    <!-- 暖橙色圆柱形渐变 -->
    <linearGradient id="label-curved-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A3412" />
      <stop offset="0.2" stop-color="#EA580C" />
      <stop offset="0.5" stop-color="#FDBA74" />
      <stop offset="0.8" stop-color="#EA580C" />
      <stop offset="1" stop-color="#9A3412" />
    </linearGradient>
  </defs>

  <!-- 罐体金属基底 -->
  <path d="M 8,20 L 8,46 A 24,8 0 0,0 56,46 L 56,20 A 24,8 0 0,0 8,20 Z" fill="url(#metal-shine)" />

  <!-- 底部金属包边 -->
  <path d="M 8,43 L 8,46 A 24,8 0 0,0 56,46 L 56,43 A 24,8 0 0,1 8,43 Z" fill="#475569" opacity="0.4" />
  <path d="M 8,45 L 8,46 A 24,8 0 0,0 56,46 L 56,45 A 24,8 0 0,1 8,45 Z" fill="#F8FAFC" opacity="0.6" />

  <!-- 纸质标签（暖橙色） -->
  <path d="M 8,26 L 8,41 A 24,8 0 0,0 56,41 L 56,26 A 24,8 0 0,0 8,26 Z" fill="url(#label-curved-orange)" />

  <!-- 标签边缘阴影 -->
  <path d="M 8,26 L 8,41 A 24,8 0 0,0 16,43 L 16,28 A 24,8 0 0,1 8,26 Z" fill="#000000" opacity="0.15" />

  <!-- 标签图案：猫咪 -->
  <g id="label-cat">
    <polygon points="19,33 17,27 22,31" fill="#FFFFFF" />
    <polygon points="27,33 29,27 24,31" fill="#FFFFFF" />
    <ellipse cx="23" cy="35" rx="5" ry="4" fill="#FFFFFF" />
    <path d="M 20,35 Q 21,36 22,35" stroke="#7C2D12" stroke-width="0.8" stroke-linecap="round" fill="none" />
    <path d="M 24,35 Q 25,36 26,35" stroke="#7C2D12" stroke-width="0.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- 标签图案：鱼骨 -->
  <g id="label-fishbone">
    <line x1="34" y1="35" x2="44" y2="35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="34,35 37,32 37,38" fill="#FFFFFF" />
    <line x1="39" y1="31" x2="39" y2="39" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="42" y1="32" x2="42" y2="38" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <polygon points="46,31 44,35 46,39" fill="#FFFFFF" />
  </g>

  <!-- 罐顶盖子 -->
  <ellipse cx="32" cy="20" rx="24" ry="8" fill="url(#metal-shine)" stroke="#475569" stroke-width="0.5" />
  <ellipse cx="32" cy="20" rx="21" ry="7" fill="none" stroke="#475569" stroke-width="1" opacity="0.5" />
  <ellipse cx="32" cy="20" rx="20.5" ry="6.8" fill="url(#metal-dark)" opacity="0.15" />

  <!-- 易拉罐拉环 -->
  <g id="pull-tab" opacity="0.9">
    <path d="M 32,20 L 26,19 L 28,21 Z" fill="#64748B" />
    <circle cx="32" cy="20" r="1.2" fill="#334155" />
    <circle cx="32" cy="20" r="0.6" fill="#94A3B8" />
    <ellipse cx="24" cy="19.5" rx="4.5" ry="2.5" fill="none" stroke="url(#metal-shine)" stroke-width="1.5" />
    <ellipse cx="24" cy="19.5" rx="2.5" ry="1.2" fill="none" stroke="#334155" stroke-width="0.5" />
  </g>

  <!-- 整体斜向反光 -->
  <path d="M 18,20 Q 24,25 24,47 Q 21,47 18,44 Z" fill="#FFFFFF" opacity="0.12" />
</svg>