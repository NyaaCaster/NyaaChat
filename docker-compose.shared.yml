# Shared-character backend — a SEPARATE compose project (name below) so it can
# be rebuilt / restarted independently of the NyaaChat frontend.
#
# Connectivity: both this project and the main one attach to the external
# `nyaachat-net` network, so the main nginx can reach this service by name
# (nyaachat-shared) and proxy /api/shared/* to it same-origin. Create the
# network once before first build:  docker network create nyaachat-net
#
# Large/persistent data (sqlite db + cover images) is bind-mounted to the host
# big disk per the project's Docker large-asset convention. Set the host base
# path via SHARED_RES_DIR in .env (see .env.example); db/ and covers/ are
# created under it. Defaults to "." (current dir) so the open-source compose
# file carries no machine-specific path.
name: nyaachat-shared

services:
  nyaachat-shared:
    build: ./shared-server
    container_name: nyaachat-shared
    environment:
      - TZ=Asia/Shanghai
      - PORT=5107
      - DB_PATH=/data/db/nyaachat-shared-v4.db
      - COVERS_DIR=/data/covers
      - USER_STORAGE_DIR=/data/user-storage
      # NyaaAcount unified account platform (P7-3 credential forwarding).
      # Values come from .env in this compose project's root (git-ignored).
      - NYAAACOUNT_PUBLIC_URL=${NYAAACOUNT_PUBLIC_URL}
      - NYAAACOUNT_API_TOKEN=${NYAAACOUNT_API_TOKEN}
      - NYAAACOUNT_ENCRYPTION_KEY=${NYAAACOUNT_ENCRYPTION_KEY}
      # Internal API secret shared with nyaachat-knowledge for P6 binding sync.
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - KNOWLEDGE_SERVER_URL=${KNOWLEDGE_SERVER_URL:-http://nyaachat-knowledge:5108}
    ports:
      # Bind to localhost only — all external traffic goes through the main
      # nginx at /api/shared/ (Docker internal nyaachat-shared:5107).  Direct
      # host access is still available for dev/debug: curl localhost:5107/health
      - "127.0.0.1:5107:5107"
    volumes:
      - ${SHARED_RES_DIR:-.}/db:/data/db
      - ${SHARED_RES_DIR:-.}/covers:/data/covers
      - ${USER_STORAGE_DIR:-./user-storage}:/data/user-storage
    networks:
      - nyaachat-net
    restart: unless-stopped

networks:
  nyaachat-net:
    external: true
